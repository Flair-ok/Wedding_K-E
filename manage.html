<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление гостями — Ксения & Егор</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manage.css">
</head>
<body>
    <div class="container">
        <h1>🌸 Гости (управление) 🌸</h1>
        <p class="subtitle">Ксения & Егор • 25 июля 2026</p>

        <div class="controls">
            <select id="filterCategory">
                <option value="">Все категории</option>
                <option>Семья Жениха</option>
                <option>Семья Невесты</option>
                <option>Друзья</option>
            </select>
            <input type="text" id="filterAge" placeholder="Возраст (например, 30)">
            <select id="filterDrink">
                <option value="">Все напитки</option>
            </select>
            <input type="text" id="filterTable" placeholder="Стол (например, 5)">
            <button class="btn" onclick="renderTable()">🔄 Обновить</button>
        </div>

        <div class="add-form">
            <h3>Добавить гостя</h3>
            <div class="form-row">
                <label>ФИО:</label><input type="text" id="newFio" placeholder="Иван Петров" style="flex:2;">
                <label>Категория:</label>
                <select id="newCategory">
                    <option>Семья Жениха</option>
                    <option>Семья Невесты</option>
                    <option>Друзья</option>
                </select>
            </div>
            <div class="form-row">
                <label>Напитки:</label>
                <div style="display:flex; gap:5px; flex-wrap:wrap;" id="newDrinksCheck">
                    <label><input type="checkbox" value="Не пью"> Не пью</label>
                    <label><input type="checkbox" value="Сок"> Сок</label>
                    <label><input type="checkbox" value="Лимонад"> Лимонад</label>
                    <label><input type="checkbox" value="Вино"> Вино</label>
                    <label><input type="checkbox" value="Шампанское"> Шампанское</label>
                    <label><input type="checkbox" value="Водка"> Водка</label>
                    <label><input type="checkbox" value="Коньяк"> Коньяк</label>
                    <label><input type="checkbox" value="Самогон"> Самогон</label>
                </div>
            </div>
            <div class="form-row">
                <label>Возраст:</label><input type="text" id="newAge" placeholder="30" style="width:80px;">
                <label>Стол:</label><input type="text" id="newTable" placeholder="Стол - 5" style="width:120px;">
                <button class="btn" onclick="addGuest()">Добавить</button>
            </div>
        </div>

        <table class="guest-table" id="guestTable">
            <thead>
                <tr>
                    <th>ФИО</th><th>Категория</th><th>Напитки</th><th>Возраст</th><th>Стол</th><th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="drink-stats" id="drinkStats"></div>
    </div>

    <script src="manage.js"></script>
</body>
</html>
