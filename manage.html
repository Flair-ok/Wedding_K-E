<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление гостями — Ксения & Егор</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="manage.css">
</head>
<body>
    <div class="container">
        <h1>🌸 Гости (управление) 🌸</h1>
        <p class="subtitle">Ксения & Егор • 25 июля 2026</p>

        <div class="controls">
            <select id="filterCategory">
                <option value="">Все категории</option>
                <option>Семья Жениха</option>
                <option>Семья Невесты</option>
                <option>Друзья</option>
            </select>
            <select id="filterAge">
                <option value="">Все возраста</option>
                <option value="<18">&lt;18</option>
                <option value="18-30">18-30</option>
                <option value="30-50">30-50</option>
                <option value=">50">&gt;50</option>
            </select>
            <div class="drink-filter-wrap">
                <select id="filterDrink">
                    <option value="">Все напитки</option>
                </select>
                <button class="btn-reset-drink" id="resetDrinkBtn" title="Сбросить напиток">✕</button>
            </div>
            <input type="text" id="filterTable" placeholder="Стол (например, 5)">
        </div>

        <div class="add-form">
            <h3>Добавить гостя</h3>
            <div class="form-row">
                <label>ФИО:</label>
                <input type="text" id="newFio" placeholder="Иван Петров" class="flex-2">
            </div>
            <div class="form-row">
                <label>Категория:</label>
                <select id="newCategory">
                    <option>Семья Жениха</option>
                    <option>Семья Невесты</option>
                    <option>Друзья</option>
                </select>
            </div>
            <div class="form-row">
                <label>Возраст:</label>
                <select id="newAge">
                    <option value="<18">&lt;18</option>
                    <option value="18-30" selected>18-30</option>
                    <option value="30-50">30-50</option>
                    <option value=">50">&gt;50</option>
                </select>
            </div>
            <div class="form-row">
                <label>Напитки:</label>
                <div class="checkbox-group" id="newDrinksCheck">
                    <label><input type="checkbox" value="Не пью"> Не пью</label>
                    <label><input type="checkbox" value="Сок"> Сок</label>
                    <label><input type="checkbox" value="Лимонад"> Лимонад</label>
                    <label><input type="checkbox" value="Вино"> Вино</label>
                    <label><input type="checkbox" value="Шампанское"> Шампанское</label>
                    <label><input type="checkbox" value="Водка"> Водка</label>
                    <label><input type="checkbox" value="Коньяк"> Коньяк</label>
                    <label><input type="checkbox" value="Самогон"> Самогон</label>
                </div>
            </div>
            <div class="form-row">
                <label>Стол:</label>
                <input type="text" id="newTable" placeholder="Стол - 5" class="table-input">
                <button class="btn btn-add" onclick="addGuest()">Добавить</button>
            </div>
        </div>

        <table class="guest-table" id="guestTable">
            <thead>
                <tr>
                    <th data-sort="fio" class="sortable">ФИО <span class="sort-arrow"></span></th>
                    <th data-sort="category" class="sortable">Категория <span class="sort-arrow"></span></th>
                    <th data-sort="drinks" class="sortable">Напитки <span class="sort-arrow"></span></th>
                    <th data-sort="age" class="sortable">Возраст <span class="sort-arrow"></span></th>
                    <th data-sort="table" class="sortable">Стол <span class="sort-arrow"></span></th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="drink-stats" id="drinkStats"></div>
    </div>

    <script src="manage.js"></script>
</body>
</html>
